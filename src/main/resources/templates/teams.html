<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Participating Clubs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f1ea;
            font-family: Georgia, serif;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* En-tête dynamique */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 25px 40px 20px 40px;
            border-bottom: 1px solid #dcd6cb;
        }

        .header-title h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: normal;
            color: #555;
            margin-bottom: 4px;
        }

        .header-title h1 {
            font-size: 32px;
            font-style: italic;
            font-weight: normal;
            letter-spacing: -0.5px;
        }

        .header-title h1 span {
            font-style: normal;
            font-weight: normal;
        }

        .header-right {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #555;
        }

        /* Grille des clubs (4 colonnes, 2 lignes par exemple) */
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            flex-grow: 1;
            width: 100%;
        }

        .club-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-right: 1px solid #dcd6cb;
            border-bottom: 1px solid #dcd6cb;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Supprimer la bordure droite pour la dernière colonne */
        .club-card:nth-child(4n) {
            border-right: none;
        }

        /* Effet Hover (fond grisé et texte blanc au survol) */
        .club-card:hover {
            background-color: #a89f9e;
            color: #ffffff;
        }

        .club-card:hover .club-name,
        .club-card:hover .club-index {
            color: #ffffff;
        }

        /* Numéro de position du club (ex: 01, 02...) */
        .club-index {
            font-size: 10px;
            letter-spacing: 1px;
            color: #777;
            text-transform: uppercase;
        }

        /* Nom du club */
        .club-name {
            font-size: 24px;
            font-style: italic;
            font-weight: normal;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            margin-top: auto;
            margin-bottom: auto;
            transition: color 0.3s ease;
        }

        /* Espace vide en bas pour conserver l'alignement visuel de l'image */
        .club-bottom {
            height: 15px;
        }
    </style>
</head>
<body>

<!-- En-tête dynamique selon la ligue -->
<header>
    <div class="header-title">
        <h3>European Football / <span th:text="${leagueName} ?: 'Premier League'">Premier League</span></h3>
        <h1>Participating Clubs</h1>
    </div>
    <div class="header-right">
        Clubs / 02
    </div>
</header>

<!-- Grille des clubs -->
<section class="clubs-grid">

    <!-- Boucle Thymeleaf pour afficher les équipes de la liste passée par le contrôleur -->
<!--    <div class="club-card" th:each="club, iterStat : ${clubs}">-->
<!--        <div class="club-index" th:text="${iterStat.count < 10 ? '0' + iterStat.count : iterStat.count}">01</div>-->
<!--        <h2 class="club-name" th:text="${club.name}">Manchester City</h2>-->
<!--        <div class="club-bottom"></div>-->
<!--    </div>-->

</section>

</body>
</html>
