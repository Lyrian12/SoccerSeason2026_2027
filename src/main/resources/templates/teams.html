<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Participating Clubs</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f1ea;
            font-family: Georgia, serif;
            color: #1a1a1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* En-tête dynamique */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 25px 40px 20px 40px;
            border-bottom: 1px solid #dcd6cb;
        }

        .header-title h3 {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: normal;
            color: #555;
            margin-bottom: 4px;
        }

        .header-title h1 {
            font-size: 32px;
            font-style: italic;
            font-weight: normal;
            letter-spacing: -0.5px;
        }

        .header-title h1 span {
            font-style: normal;
            font-weight: normal;
        }

        .header-right {
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #555;
        }

        /* Grille des clubs */
        .clubs-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            flex-grow: 1;
            width: 100%;
        }

        /* Transformé en balise <a> mais gardant l'aspect visuel */
        .club-card {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            border-right: 1px solid #dcd6cb;
            border-bottom: 1px solid #dcd6cb;
            text-decoration: none; /* Supprime le soulignement du lien */
            color: inherit;        /* Conserve la couleur du texte */
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Supprimer la bordure droite pour la dernière colonne */
        .club-card:nth-child(4n) {
            border-right: none;
        }

        /* Effet Hover */
        .club-card:hover {
            background-color: #a89f9e;
            color: #ffffff;
        }

        .club-card:hover .club-name,
        .club-card:hover .club-index {
            color: #ffffff;
        }

        /* Numéro de position du club */
        .club-index {
            font-size: 10px;
            letter-spacing: 1px;
            color: #777;
            text-transform: uppercase;
        }

        /* Nom du club */
        .club-name {
            font-size: 24px;
            font-style: italic;
            font-weight: normal;
            letter-spacing: -0.5px;
            color: #1a1a1a;
            margin-top: auto;
            margin-bottom: auto;
            transition: color 0.3s ease;
        }

        .club-bottom {
            height: 15px;
        }
    </style>
</head>
<body>

<!-- En-tête dynamique selon la ligue -->
<header>
    <div class="header-title">
        <h3>European Football / <span th:text="${leagueName} ?: 'Premier League'"></span></h3>
        <h1>Participating Clubs</h1>
    </div>
    <div class="header-right">
        Clubs / <span th:text="${totalClubs} ?: 0">0</span>
    </div>
</header>

<!-- Grille des clubs -->
<section class="clubs-grid">

    <!-- Chaque carte est maintenant un lien dynamique vers l'effectif de l'équipe -->
    <a class="club-card"
       th:each="club, iterStat : ${clubs}"
       th:href="@{/teams/{id}/squad(id=${club.id})}">

        <div class="club-index" th:text="${iterStat.count < 10 ? '0' + iterStat.count : iterStat.count}">01</div>
        <h2 class="club-name" th:text="${club.name}">Manchester City</h2>
        <div class="club-bottom"></div>
    </a>

</section>

</body>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const colors = [
            "#e63946", "#f1faee", "#a8dadc", "#457b9d", "#1d3557",
            "#264653", "#2a9d8f", "#e9c46a", "#f4a261", "#e76f51",
            "#b5179e", "#7209b7", "#3a0ca3", "#4cc9f0", "#f72585"
        ];

        const cards = document.querySelectorAll(".club-card");

        cards.forEach(card => {
            card.addEventListener("mouseenter", function () {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                card.style.backgroundColor = randomColor;
                card.style.color = "#ffffff";
            });

            card.addEventListener("mouseleave", function () {
                card.style.backgroundColor = "";
                card.style.color = "";
            });
        });
    });
</script>
</html>
